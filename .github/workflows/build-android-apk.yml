
name: Build LibrePods APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source tag or branch
        required: true
        default: oneui9-redesign

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK
        run: sdkmanager "ndk;30.0.14904198"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          sed -i '/^org.gradle.jvmargs=/d' gradle.properties
          printf '\norg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\n' >> gradle.properties
          ./gradlew --no-daemon --max-workers=2 assembleFossDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LibrePods-FOSS-debug
          path: android/app/build/outputs/apk/foss/debug/app-foss-debug.apk
          if-no-files-found: error
          retention-days: 14

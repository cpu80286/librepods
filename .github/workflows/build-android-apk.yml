
name: Build LibrePods APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source tag or branch
        required: true
        default: v1.0.4

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: librepods-org/librepods
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;30.0.14904198"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleFossDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LibrePods-FOSS-debug
          path: android/app/build/outputs/apk/foss/debug/app-foss-debug.apk
          if-no-files-found: error
          retention-days: 14
